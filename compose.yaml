name: kornode

services:
  kornode:
    build:
      context: .
    image: kornode:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      KORNODE_CONFIG: /etc/kornode/config.yaml
      KORNODE_PROC_SYS: /host/proc/sys
    cap_add:
      - NET_ADMIN
      - NET_RAW
    network_mode: host
    devices:
      - /dev/net/tun:/dev/net/tun
      # Optional accelerated TUN path for openconnect. Docker refuses to start
      # the container if a listed device is missing on the host, so enable it
      # only when /dev/vhost-net exists (`modprobe vhost_net`).
      # - /dev/vhost-net:/dev/vhost-net
    volumes:
      # Docker mounts /proc/sys read-only and refuses `sysctls:` with host networking;
      # the reconciler sets ip_forward/src_valid_mark/rp_filter through the host's
      # net.* only (D-83), never privileged or with unmasked /proc.
      - /proc/sys/net:/host/proc/sys/net
      - ./config:/etc/kornode
      - ./data:/var/lib/kornode
      - ./logs:/var/log/kornode
