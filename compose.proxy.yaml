services:
  kornode:
    environment:
      KORNODE_WEB__ENABLED: "true"
      KORNODE_WEB__LISTEN: 127.0.0.1
      KORNODE_WEB__PORT: "8443"
      KORNODE_WEB__TLS: "false"
      KORNODE_WEB__ALLOW_INSECURE_HTTP: "true"
      KORNODE_WEB__TRUSTED_PROXIES: ${KORNODE_WEB__TRUSTED_PROXIES:-["127.0.0.1"]}
      KORNODE_WEB__ADMIN_PASSWORD: ${KORNODE_ADMIN_PASSWORD:-change-me}
