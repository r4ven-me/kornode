name: Disposable VM E2E

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Run only on owner-designated disposable VMs
        type: choice
        required: true
        default: 'NO'
        options: ['NO', DISPOSABLE_VMS]

permissions:
  contents: read

concurrency:
  group: kornode-disposable-vm-e2e
  cancel-in-progress: false

jobs:
  e2e:
    # workflow_dispatch only, and only from a protected branch: a pull_request
    # trigger would run the workflow file of the PR on the privileged runner.
    if: >-
      vars.E2E_ENVIRONMENT_APPROVAL_CONFIGURED == 'true' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref_protected &&
      inputs.confirmation == 'DISPOSABLE_VMS'
    environment: kornode-e2e
    runs-on: [self-hosted, kornode-e2e]
    timeout-minutes: 90
    env:
      E2E_ALLOW_DESTRUCTIVE: I_ACKNOWLEDGE_DISPOSABLE_VMS
      E2E_HUB_HOST: ${{ vars.E2E_HUB_HOST }}
      E2E_AGENT_A_HOST: ${{ vars.E2E_AGENT_A_HOST }}
      E2E_AGENT_B_HOST: ${{ vars.E2E_AGENT_B_HOST }}
      E2E_EXT_HOST: ${{ vars.E2E_EXT_HOST }}
      E2E_HUB_ADDRESS: ${{ vars.E2E_HUB_ADDRESS }}
      E2E_SSH_USER: ${{ vars.E2E_SSH_USER }}
      E2E_SSH_PORT: ${{ vars.E2E_SSH_PORT || '22' }}
      E2E_PREVIOUS_HUB_IMAGE: ${{ vars.E2E_PREVIOUS_HUB_IMAGE }}
      E2E_PREVIOUS_AGENT_IMAGE: ${{ vars.E2E_PREVIOUS_AGENT_IMAGE }}
    steps:
      # No pull_request/pull_request_target: privileged runner access requires a
      # manual dispatch from a protected branch AND the protected environment approval.
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          # Default clean would delete artifacts/e2e/*/active.json, the recovery
          # ledger of an interrupted previous run.
          clean: false
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Provision ephemeral pinned SSH credentials
        env:
          E2E_SSH_KEY: ${{ secrets.E2E_SSH_KEY }}
          E2E_SSH_KNOWN_HOSTS: ${{ secrets.E2E_SSH_KNOWN_HOSTS }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          directory = Path(os.environ['RUNNER_TEMP']) / 'kornode-e2e-ssh'
          directory.mkdir(mode=0o700)
          for name, variable in [('key', 'E2E_SSH_KEY'), ('known_hosts', 'E2E_SSH_KNOWN_HOSTS')]:
              value = os.environ.get(variable, '')
              if not value.strip():
                  raise SystemExit('E2E SSH credentials/pins are not configured')
              fd = os.open(directory / name, os.O_CREAT | os.O_EXCL | os.O_WRONLY, 0o600)
              with os.fdopen(fd, 'w') as handle:
                  handle.write(value.rstrip('\n') + '\n')
          with open(os.environ['GITHUB_ENV'], 'a') as handle:
              handle.write(f'E2E_SSH_KEY_FILE={directory / "key"}\n')
              handle.write(f'E2E_KNOWN_HOSTS_FILE={directory / "known_hosts"}\n')
          PY
      - run: python -m venv .e2e-venv && .e2e-venv/bin/python -m pip install -e '.[dev]'
      - name: Check harness locally before remote access
        run: |
          .e2e-venv/bin/python -m mypy --explicit-package-bases tests/e2e
          .e2e-venv/bin/python -m pytest tests/test_e2e_harness.py -q --tb=short
      - name: Preflight, lease, build/load images, deploy, run and teardown
        run: .e2e-venv/bin/python -m pytest tests/e2e --e2e-run -q --tb=short --junitxml=artifacts/e2e/junit.xml
      - name: Recover interrupted owned runs
        if: always()
        run: .e2e-venv/bin/python -m tests.e2e cleanup --all-owned --yes
      - name: Upload allowlisted sanitized evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vm-e2e-evidence
          path: |
            artifacts/e2e/**/summary.json
            artifacts/e2e/junit.xml
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove ephemeral SSH material
        if: always()
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          directory = Path(os.environ['RUNNER_TEMP']) / 'kornode-e2e-ssh'
          for name in ('key', 'known_hosts'):
              (directory / name).unlink(missing_ok=True)
          if directory.exists():
              directory.rmdir()
          PY
