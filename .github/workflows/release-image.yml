name: Release image

# Publishes ghcr.io/<owner>/kornode:v<version> and :latest whenever the
# version in pyproject.toml has no image yet, i.e. after a version bump lands
# on main. Runs only once CI has passed for that commit.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: release-image
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # The commit CI just tested, not whatever main points at now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Read version
        id: version
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/kornode"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "Project version: ${version}, image: ${image}"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip if this version is already published
        id: exists
        run: |
          if docker manifest inspect "${{ steps.version.outputs.image }}:v${{ steps.version.outputs.version }}" > /dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "v${{ steps.version.outputs.version }} is already in GHCR; nothing to do."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v4
        if: steps.exists.outputs.published != 'true'

      - uses: docker/metadata-action@v6
        if: steps.exists.outputs.published != 'true'
        id: meta
        with:
          images: ${{ steps.version.outputs.image }}
          tags: |
            type=raw,value=v${{ steps.version.outputs.version }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - uses: docker/build-push-action@v7
        if: steps.exists.outputs.published != 'true'
        with:
          context: .
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Optional repository variable: pins the ocserv source tarball hash.
          build-args: |
            OCSERV_SHA256=${{ vars.OCSERV_SHA256 }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
