name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install certtool for certificate tests
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gnutls-bin
      - run: python -m pip install -e '.[dev]'
      - run: make lint PYTHON=python
      - run: make typecheck PYTHON=python
      - run: make test PYTHON=python
      - run: make render PYTHON=python
      - run: make parity PYTHON=python

  container-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      # Only test stages: no runtime image or ocserv compilation in ordinary CI.
      - name: Validate frontend test stage
        uses: docker/build-push-action@v7
        with:
          context: .
          target: frontend-test
          push: false
          cache-from: type=gha,scope=frontend-test
          cache-to: type=gha,scope=frontend-test,mode=max
      - name: Validate backend test stage and repository fixtures
        uses: docker/build-push-action@v7
        with:
          context: .
          target: backend-test
          push: false
          cache-from: type=gha,scope=backend-test
          cache-to: type=gha,scope=backend-test,mode=max

  netlab:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install namespace test tooling
        run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          iproute2 nftables tcpdump ocserv openconnect gnutls-bin dnsmasq-base
      # A venv rather than setup-python's interpreter directly: `sudo` resets
      # PATH, and the Makefile picks .venv/bin/python up by path.
      - run: python -m venv .venv && .venv/bin/python -m pip install -e '.[dev]'
      - run: sudo make netlab
      - name: Upload netlab failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: netlab-artifacts
          path: artifacts/netlab/
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend test
      # `build` runs tsc before vite, so this is also the typecheck.
      - run: npm --prefix frontend run build
      - run: npm --prefix frontend audit --audit-level=moderate
