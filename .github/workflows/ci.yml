name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install certtool for certificate tests
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gnutls-bin
      - run: python -m pip install -e '.[dev]'
      - run: make lint PYTHON=python
      - run: make typecheck PYTHON=python
      - run: make test PYTHON=python
      - run: make render PYTHON=python

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend test
      # `build` runs tsc before vite, so this is also the typecheck.
      - run: npm --prefix frontend run build
      - run: npm --prefix frontend audit --audit-level=moderate
