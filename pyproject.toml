[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kornode"
version = "1.0.0"
description = "Korvus Node OpenConnect/ocserv VPN management platform"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Ivan Cherniy" }]
dependencies = [
  "fastapi>=0.111,<1",
  "jinja2>=3.1,<4",
  "pydantic>=2.7,<3",
  "python-multipart>=0.0.9,<1",
  "python-dotenv>=1.0,<2",
  "pyyaml>=6,<7",
  "typer>=0.12,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "httpx2>=2,<3",
  "mypy>=1.10,<2",
  "pytest>=8.2,<9",
  "ruff>=0.5,<1",
  "types-PyYAML>=6,<7",
]

[project.urls]
Homepage = "https://r4ven.me"
Repository = "https://github.com/r4ven-me/kornode"

[project.scripts]
korctl = "kornode.cli:app"
kornode = "kornode.main:run"

[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.packages.find]
where = ["backend"]

[tool.setuptools.package-data]
kornode = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]
filterwarnings = [
  # starlette's own TestClient still references this alias internally as of
  # 1.6.0 (the latest release) -- not kornode code, nothing to fix on our
  # side, and it doesn't affect behavior. Drop this once starlette updates
  # its own internal usage.
  "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning:starlette.testclient",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "backend"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["yaml.*"]
ignore_missing_imports = true
