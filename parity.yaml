    service: null
    cli: null
    api: "PATCH /api/config"
    ui: null
    exempt: "API helper used by structured settings endpoints; not a standalone panel or CLI capability."
  - id: config.general_settings
    service: null
    cli: null
    api: "POST /api/config/general-settings"
    ui: config.general_settings
