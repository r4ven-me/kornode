    service: kornode.services.config.ConfigService.diff_rendered_files
    cli: "config diff"
    api: "GET /api/config/diff"
    ui: config.diff
  - id: config.show
    service: null
    cli: null
    api: "GET /api/config"
    ui: config.show
    exempt: "v1 gap: config overview has API and panel but no dedicated CLI beyond config validate/render/diff."
