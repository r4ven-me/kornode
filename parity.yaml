capabilities:
  - id: config.validate
    service: kornode.config.loader.load_config
    cli: "config validate"
    api: "GET /api/config/validate"
    ui: config.validate
  - id: config.render
    service: kornode.services.config.ConfigService.write_rendered_files
    cli: "config render"
    api: "POST /api/config/render"
    ui: config.render
