system:
  timezone: Europe/Moscow
  data_dir: /var/lib/kornode
  log_dir: /var/log/kornode
  generated_dir: /var/lib/kornode/generated
  secrets_dir: /var/lib/kornode/secrets
  log_level: info
  project_name: kornode

# No VPN server on this box -- kornode only dials out. No `auth:`/
# `certificates:` section either: nothing to authenticate against or issue
# certificates for without ocserv running.
server:
  enabled: false

upstream:
  enabled: true
  interface: oc-office0
  active_profile: office
  check_interval: 5
  check_threshold: 3
  check_settle_seconds: 15
  failover: false
  profiles:
    - name: office
      server: vpn.example.com
      port: "443"
      auth_type: password
      username: office-client
      password: "${SECRET:OFFICE_PASSWORD}"
      check_host: 10.11.11.1

# This host's own traffic reaches the office networks and domains through the tunnel:
# explicit egress rules (first match wins), see docs/spec/02-egress-and-sources.md.
sets:
  office:
    routes:
      - 10.60.0.0/16
    domains:
      - internal.example.com
egress:
  - from: [host]
    to: {set: office}
    via: upstream:office

routing:
  # Point this host's own resolver at the built-in dnsmasq, so the domains
  # above resolve the same way for this host's own lookups -- not just the
  # container's own. Needs the extra bind mount in compose.client.yaml. See
  # "Host DNS" in README.md.
  host_dns: resolv_conf

cli:
  enabled: true

advanced:
  raw_ocserv_options: []
