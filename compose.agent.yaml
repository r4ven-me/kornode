# kornode agent. Enroll once, then run:
#   docker compose -f compose.agent.yaml run --rm agent kornode-agent enroll <token>
#   docker compose -f compose.agent.yaml up -d
# Without the source tree, use the published image instead of building:
#   export KORNODE_AGENT_IMAGE=ghcr.io/r4ven-me/kornode-agent:latest
#   docker compose -f compose.agent.yaml pull
# then run the two commands above: an image that is present is used, not rebuilt.
name: kornode-agent

services:
  agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
    image: ${KORNODE_AGENT_IMAGE:-kornode-agent:latest}
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - NET_RAW
    network_mode: host
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      KORNODE_PROC_SYS: /host/proc/sys
    volumes:
      # Read-only /proc/sys under host networking: net.* only, see compose.yaml (D-83).
      - /proc/sys/net:/host/proc/sys/net
      - ./agent-data:/var/lib/kornode-agent
    entrypoint: []
    command: ["/usr/bin/supervisord", "-c", "/etc/supervisor/conf.d/kornode-agent.conf"]
