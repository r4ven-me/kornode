[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid
user=root

; Local control socket for the agent only (root, 0700): it starts, restarts
; and stops dnsmasq from the active bundle (D-66).
[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[program:agent]
command=kornode-agent run
autostart=true
autorestart=true
startretries=100
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Node resolver; configuration written by the agent, never started on its own.
[program:dnsmasq]
command=/usr/sbin/dnsmasq --keep-in-foreground --pid-file= --conf-file=/var/lib/kornode-agent/run/dnsmasq.conf
autostart=false
autorestart=true
startretries=100
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Access server of role `access`; configuration written by the agent, never
; started on its own (D-67).
[program:ocserv]
command=/usr/sbin/ocserv --foreground --log-stderr --config /run/kornode-access/ocserv.conf
autostart=false
autorestart=true
startretries=100
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
